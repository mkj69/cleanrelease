[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanrelease"
version = "0.1.0"
description = "Check, archive, and publish a selected Git tree"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "The cleanrelease authors"}]
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/mkj69/cleanrelease"
Repository = "https://github.com/mkj69/cleanrelease"
Issues = "https://github.com/mkj69/cleanrelease/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1"]

[project.scripts]
cleanrelease = "cleanrelease.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
