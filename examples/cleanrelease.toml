[source]
ref = "HEAD"

[public]
remote = ""
branch = "main"
history = "orphan"
force = false
exclude = ["cleanrelease.toml", "notes/", "data/", "outputs/", "site/"]
author_name = "Release Bot"
author_email = "mkj69@users.noreply.github.com"
message = "Public cleanrelease release"

[checks]
max_file_size = 50000000
utf8_only = true
charset_allow = []
forbidden_paths = ["**/*_results.md", "outputs/", "data/private/**"]
forbidden_regexes = []
email_allow = ["pyproject.toml", "examples/cleanrelease.toml", "src/cleanrelease/config.py", "src/cleanrelease/gitops.py", "tests/test_release.py"]
name_patterns = []
name_allow = ["CITATION.cff"]

[test_public_tree]
enabled = true
command = ["python", "-m", "pytest", "-q"]
allow = []

[public.strip_json]
enabled = false
paths = ["data/public/**"]
key_pattern = "^private_"

[archive]
remote = ""
exclude_refs = ["refs/heads/worktree-*", "refs/tags/temporary-*"]
snapshot_paths = ["notes/"]
snapshot_branch = "archive-snapshot"
snapshot_from = "HEAD"
max_file_size = 50000000

[pages]
enabled = false
build = []
output = "site"
branch = "gh-pages"

[github]
repo = ""
visibility = ""
discussions = false
pages = false
homepage = ""
topics = []

[[github.discussion_categories]]
name = "General"

[install_check]
smoke = [["python", "-c", "import cleanrelease"], ["cleanrelease", "--help"]]
